services:
  gateway:
    build: ./gateway
    container_name: altus-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MOCK_PLC=false
      - CLP_IP=192.168.15.1
      - CLP_SLOT=0

